# NixOS VM tests: the runtime and generation tests, the installer, and the
# gym's fault catalog on real VMs (one NixOS test per entry). Linux runners
# have KVM once /dev/kvm is opened to the runner user.
#
# A push to main runs the VM checks, the GA demonstration and the gym smoke
# entries; a pull request runs the gym smoke entries only. A newer push
# cancels either. The whole catalog is one job per VM entry (94
# at v4.6, several hundred runner minutes), so it runs only by hand (Actions →
# VM tests → Run workflow → catalog).
name: VM tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:
    inputs:
      catalog:
        description: "Also run the gym catalog on VMs"
        type: boolean
        default: false
      ids:
        description: "Only these catalog entries (space-separated ids; empty: all)"
        type: string
        default: ""

concurrency:
  group: vm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Build Planarian once (the gym's test build and the release package) and
  # hand it to every VM job as a binary cache, instead of each job compiling
  # it again (about 3 of its 4 build minutes; #8). The signing key is made
  # here for this run and never leaves this job; its public half is the job's
  # output, which each VM job trusts for this run's cache only.
  prebuild:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.cache.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: trusted-users = root runner
      - id: cache
        run: |
          attrs=".#legacyPackages.x86_64-linux.gym-hooks .#packages.x86_64-linux.planarian"
          nix build -L --no-link $attrs
          paths=$(nix path-info $attrs)
          sk="$RUNNER_TEMP/ci.sk"
          nix key generate-secret --key-name "planarian-ci-${{ github.run_id }}" > "$sk"
          nix store sign --key-file "$sk" $paths
          echo "key=$(nix key convert-secret-to-public < "$sk")" >> "$GITHUB_OUTPUT"
          rm -f "$sk"
          nix copy --to "file:///tmp/nix-ci-cache?compression=zstd" $paths
          du -sh /tmp/nix-ci-cache
      - uses: actions/cache/save@v4
        with:
          path: /tmp/nix-ci-cache
          key: nix-ci-${{ github.run_id }}

  vm:
    needs: prebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [vm-runtime, vm-generations, vm-posture, installer]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Planarian from the prebuild job's signed cache (a miss builds it).
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-ci-cache
          key: nix-ci-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = file:///tmp/nix-ci-cache
            extra-trusted-public-keys = ${{ needs.prebuild.outputs.key }}
      - run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  ga-demo:
    needs: prebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        id: [svc-killed, svc-misconfig-listen-address, crash-activating-bad, crash-daemon-restart-reconciles]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Planarian from the prebuild job's signed cache (a miss builds it).
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-ci-cache
          key: nix-ci-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = file:///tmp/nix-ci-cache
            extra-trusted-public-keys = ${{ needs.prebuild.outputs.key }}
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          jq -e '.result == "PASS"' verdict/verdict.json

  # Catalog entries that guard the gym harness itself on every push: a step
  # timed into a change (the pause handshake, a PATH-dependent fault), a
  # user session with a device and its root cause, and a real /boot.
  gym-smoke:
    needs: prebuild
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The v4.4 posture and journal-integrity entries run on every push:
        # their responses are systemd's, so only the VM can judge them.
        id: [stale-owner-edit-during-build, drv-unbound-audio, storage-boot-full-publish,
             posture-absent-masked, posture-crashed-budget, posture-integrity-core-hash,
             posture-integrity-journal-chain, posture-integrity-undeclared-early-unit, journal-record-edited,
             malicious-decl-owner-rebuild, malicious-decl-catalog-enable, malicious-decl-input-update,
             residue-stop-security-unit, residue-kill9-security]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Planarian from the prebuild job's signed cache (a miss builds it).
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-ci-cache
          key: nix-ci-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = file:///tmp/nix-ci-cache
            extra-trusted-public-keys = ${{ needs.prebuild.outputs.key }}
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          jq -e '.result == "PASS"' verdict/verdict.json

  # The Firecracker microVM target (SPEC §4, Phase A): non-gating, allowed to
  # stay red. Boots Planarian under Firecracker and checks one repair.
  firecracker:
    needs: prebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Planarian from the prebuild job's signed cache (a miss builds it).
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-ci-cache
          key: nix-ci-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = file:///tmp/nix-ci-cache
            extra-trusted-public-keys = ${{ needs.prebuild.outputs.key }}
      - run: nix build -L .#firecracker-target -o fc
      - run: fc/bin/run-firecracker-target

  catalog-ids:
    if: inputs.catalog
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          ONLY: ${{ inputs.ids }}
        run: |
          python3 -c 'import json, os, tomllib; c = "crates/gym/catalog/phase-a"; d = tomllib.loads("\n".join(open(os.path.join(c, f)).read() for f in sorted(os.listdir(c)) if f.endswith(".toml"))); only = os.environ["ONLY"].split(); print("ids=" + json.dumps([e["id"] for e in d["fault"] if "vm" in e.get("harness", []) and (not only or e["id"] in only)]))' >> "$GITHUB_OUTPUT"

  catalog:
    needs: [catalog-ids, prebuild]
    runs-on: ubuntu-24.04
    # An entry's window is at most an hour; a VM that never wakes from
    # suspend must not hold a runner for six.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.catalog-ids.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Planarian from the prebuild job's signed cache (a miss builds it).
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-ci-cache
          key: nix-ci-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = file:///tmp/nix-ci-cache
            extra-trusted-public-keys = ${{ needs.prebuild.outputs.key }}
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          # R12: the §15 harness contract (waivers are docs/deviations.md rows).
          python3 nix/gym/harness-contract.py vm crates/gym/catalog/phase-a docs/deviations.md verdict/verdict.json
          jq -r '"\(.id): \(.result)"' verdict/verdict.json >> "$GITHUB_STEP_SUMMARY"
      # Best effort: the verdict is in the log above too, and a private
      # repository's artifact storage is small (the evidence is not uploaded).
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verdict-${{ matrix.id }}
          path: verdict/verdict.json
          retention-days: 7
