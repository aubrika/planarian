# NixOS VM tests: the runtime and generation tests, the installer, and the
# gym's fault catalog on real VMs (one NixOS test per entry). Linux runners
# have KVM once /dev/kvm is opened to the runner user.
#
# Pushes and pull requests run the core VM checks and critical catalog cases;
# newer revisions cancel them. The complete catalog is derived from the
# current manifest and runs by hand (Actions → VM tests → Run workflow → catalog).
name: VM tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      catalog:
        description: "Also run the gym catalog on VMs"
        type: boolean
        default: false
      ids:
        description: "Only these catalog entries (space-separated ids; empty: all)"
        type: string
        default: ""

concurrency:
  group: vm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  vm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [vm-runtime, vm-generations, vm-posture, installer, vm-installed-boot, vm-installed-boot-watchdog, vm-boot-confirmation]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  installed-publication:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        point: [built, publication-intent, operation-intent, mutation, acknowledgment, awaiting-boot]
        recoverer: [daemon, watchdog]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.boot-entry-tests.${{ matrix.point }}-${{ matrix.recoverer }}

  ga-demo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        id: [svc-killed, svc-misconfig-listen-address, crash-activating-bad, crash-daemon-restart-reconciles]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          python3 nix/gym/acceptance.py check --harness vm --id "${{ matrix.id }}" --waivers docs/acceptance-waivers.toml verdict/verdict.json

  # Catalog entries that guard the gym harness itself on every push: a step
  # timed into a change (the pause handshake, a PATH-dependent fault), a
  # user session with a device and its root cause, and a real /boot.
  gym-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The v4.4 posture and journal-integrity entries run on every push:
        # their responses are systemd's, so only the VM can judge them.
        id: [stale-owner-edit-during-build, drv-unbound-audio, storage-boot-full-publish,
             posture-absent-masked, posture-crashed-budget, posture-integrity-core-hash,
             posture-integrity-journal-chain, posture-integrity-undeclared-early-unit, journal-record-edited,
             malicious-decl-owner-rebuild, malicious-decl-catalog-enable, malicious-decl-input-update,
             residue-stop-security-unit, residue-kill9-security,
             gc-during-approval, agent-run-own-principal, agent-has-its-users-permissions,
             probe-http-503-degraded, floor-service-package-fix, approve-at-terminal-runs, agent-name-collision]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          python3 nix/gym/acceptance.py check --harness vm --id "${{ matrix.id }}" --waivers docs/acceptance-waivers.toml verdict/verdict.json

  # The Firecracker microVM target (SPEC §4, Phase A): non-gating, allowed to
  # stay red. Boots Planarian under Firecracker and checks one repair.
  firecracker:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#firecracker-target -o fc
      - run: fc/bin/run-firecracker-target

  catalog-ids:
    if: inputs.catalog
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          ONLY: ${{ inputs.ids }}
        run: |
          python3 -c 'import json, os, sys; sys.path.insert(0, "nix/gym"); import acceptance; entries = acceptance.catalog_entries("crates/gym/catalog/phase-a.toml"); ids = acceptance.expected_entries(entries, "vm", os.environ["ONLY"].split()); print("ids=" + json.dumps(list(ids)))' >> "$GITHUB_OUTPUT"

  catalog:
    needs: catalog-ids
    runs-on: ubuntu-24.04
    # An entry's window is at most an hour; a VM that never wakes from
    # suspend must not hold a runner for six.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.catalog-ids.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          python3 nix/gym/acceptance.py check --harness vm --id "${{ matrix.id }}" --waivers docs/acceptance-waivers.toml verdict/verdict.json
          jq -r '"\(.id): \(.result)"' verdict/verdict.json >> "$GITHUB_STEP_SUMMARY"
      # Best effort: the verdict is in the log above too, and a private
      # repository's artifact storage is small (the evidence is not uploaded).
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verdict-${{ matrix.id }}
          path: verdict/verdict.json
          retention-days: 7
