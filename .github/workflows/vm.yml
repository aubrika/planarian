# NixOS VM tests: the runtime and generation tests, the installer, and the
# gym's fault catalog on real VMs (one NixOS test per entry). Linux runners
# have KVM once /dev/kvm is opened to the runner user.
#
# A push runs the VM checks, the GA demonstration and the gym smoke entries
# (a newer push cancels them); the whole catalog is one job per VM entry (94
# at v4.6, several hundred runner minutes), so it runs only by hand (Actions →
# VM tests → Run workflow → catalog).
name: VM tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      catalog:
        description: "Also run the gym catalog on VMs"
        type: boolean
        default: false
      ids:
        description: "Only these catalog entries (space-separated ids; empty: all)"
        type: string
        default: ""

concurrency:
  group: vm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  vm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [vm-runtime, vm-generations, vm-posture, installer]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  ga-demo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        id: [svc-killed, svc-misconfig-listen-address, crash-activating-bad, crash-daemon-restart-reconciles]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          jq -e '.result == "PASS"' verdict/verdict.json

  # Catalog entries that guard the gym harness itself on every push: a step
  # timed into a change (the pause handshake, a PATH-dependent fault), a
  # user session with a device and its root cause, and a real /boot.
  gym-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The v4.4 posture and journal-integrity entries run on every push:
        # their responses are systemd's, so only the VM can judge them.
        id: [stale-owner-edit-during-build, drv-unbound-audio, storage-boot-full-publish,
             posture-absent-masked, posture-crashed-budget, posture-integrity-core-hash,
             posture-integrity-journal-chain, posture-integrity-undeclared-early-unit, journal-record-edited,
             malicious-decl-owner-rebuild, malicious-decl-catalog-enable, malicious-decl-input-update,
             residue-stop-security-unit, residue-kill9-security]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          jq -e '.result == "PASS"' verdict/verdict.json

  # The Firecracker microVM target (SPEC §4, Phase A): non-gating, allowed to
  # stay red. Boots Planarian under Firecracker and checks one repair.
  firecracker:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#firecracker-target -o fc
      - run: fc/bin/run-firecracker-target

  catalog-ids:
    if: inputs.catalog
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          ONLY: ${{ inputs.ids }}
        run: |
          python3 -c 'import json, os, tomllib; d = tomllib.load(open("crates/gym/catalog/phase-a.toml", "rb")); only = os.environ["ONLY"].split(); print("ids=" + json.dumps([e["id"] for e in d["fault"] if "vm" in e.get("harness", []) and (not only or e["id"] in only)]))' >> "$GITHUB_OUTPUT"

  catalog:
    needs: catalog-ids
    runs-on: ubuntu-24.04
    # An entry's window is at most an hour; a VM that never wakes from
    # suspend must not hold a runner for six.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.catalog-ids.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.gym-vm.${{ matrix.id }} -o verdict
      - name: Verdict
        run: |
          cat verdict/verdict.json
          # UNSUPPORTED only where the test VM cannot run the entry by design
          # (docs/ga-status.md); anywhere else it is a harness regression.
          jq -e --arg id '${{ matrix.id }}' '.result == "PASS" or (.result == "UNSUPPORTED" and ($id == "storage-nix-full-gc" or $id == "desktop-boot-fails-rollback"))' verdict/verdict.json
          jq -r '"\(.id): \(.result)"' verdict/verdict.json >> "$GITHUB_STEP_SUMMARY"
      # Best effort: the verdict is in the log above too, and a private
      # repository's artifact storage is small (the evidence is not uploaded).
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verdict-${{ matrix.id }}
          path: verdict/verdict.json
          retention-days: 7
