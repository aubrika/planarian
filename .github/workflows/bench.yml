name: Headless invisibility subset

# SPEC §21: complete selected-service cgroup idle costs and actual frame
# samples from Xonotic/llvmpipe. This cannot certify personal-profile GA or
# the still-required external HID/optical input-to-display measurements.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  invisibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Performance-evidence negative regressions
        run: python3 nix/gym/test_performance.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#legacyPackages.x86_64-linux.bench.invisibility -o bench
      - name: Report
        if: always()
        run: cat bench/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-invisibility-evidence
          path: |
            bench/report.json
            bench/raw.tar.gz
          if-no-files-found: error
