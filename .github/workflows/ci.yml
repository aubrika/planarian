# The Phase A gates that fit on a standard runner (SPEC §17: tests, the gym's
# Phase A catalog, the dependency-boundary check, Verus proofs, Kani
# harnesses). The VM tests are in vm.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy with the gym's fault-injection hooks
        run: cargo clippy -p planarian-daemon -p planarian-backend-linux --all-targets --features planarian-daemon/gym-hooks -- -D warnings
      - run: cargo test --workspace
      - name: Journal properties at the default journal size (64 MiB; #[ignore] in cargo test)
        run: cargo test -p planarian-txn --test journal_props -- --ignored at_the_default_journal_size
      - name: netwatch's loader tests (the cgroups invocation property must run, not skip)
        env:
          NETWATCH_REQUIRE_XATTR_TESTS: "1"
        run: cargo test -p planarian-backend-netwatch --features loader
      - name: Fault catalog, fake harness (strict, R15; fails on FAIL, PARTIAL or an unwaived UNSUPPORTED)
        run: cargo run -p planarian-gym -- run --strict
      - name: GA demonstration, fake harness
        run: crates/gym/demo.sh --harness fake
      - name: Dependency boundaries
        run: bash nix/tests/boundaries.sh .
      - name: Dependency boundaries catch a planted violation in each place (H9)
        run: bash nix/tests/boundaries-test.sh .
      - name: Verification ratio d:a and the trust count (SPEC §17a; fails if either regresses)
        run: cargo run -q -p planarian-gym -- verification

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The Verus source is a GitHub release download that has been returning
      # 504s. Keep the fetched store path in a file:// binary cache keyed on
      # nix/verus.nix, restore it before the build, and retry the download
      # when the cache is cold. The cache saves only after the job succeeds.
      - uses: actions/cache@v4
        with:
          path: ~/verus-src-cache
          key: verus-src-${{ hashFiles('nix/verus.nix') }}
      - name: Verus source (from cache, else download with retries)
        run: |
          expr='(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.callPackage ./nix/verus.nix {}'
          src=$(nix eval --raw --impure --expr "($expr).src.outPath")
          echo "verus source: $src"
          if [ -d ~/verus-src-cache ]; then
            nix copy --no-check-sigs --from "file://$HOME/verus-src-cache" "$src" || true
          fi
          for i in 1 2 3 4 5 6; do
            nix build --no-link --impure --expr "($expr).src" && break
            [ "$i" = 6 ] && exit 1
            sleep $((i * 20))
          done
          # Whatever the path's origin (cache or download), it must hash to the
          # fetchzip's outputHash in nix/verus.nix (the NAR hash of the unpacked
          # source). A mismatch fails the job and the cache is not saved.
          want=$(nix eval --raw --impure --expr "($expr).src.outputHash")
          got=$(nix hash path --sri "$src")
          [ "$got" = "$want" ] || { echo "verus source hash $got, want $want"; exit 1; }
          if [ ! -d ~/verus-src-cache ]; then
            nix copy --no-check-sigs --to "file://$HOME/verus-src-cache" "$src"
          fi
      - name: Package, module evaluation, boundaries, Verus proofs, the demo VM (H8)
        run: >
          nix build -L
          .#checks.x86_64-linux.package
          .#checks.x86_64-linux.module-eval
          .#checks.x86_64-linux.raw-units
          .#checks.x86_64-linux.boundaries
          .#checks.x86_64-linux.verus
          .#checks.x86_64-linux.demo-vm

  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-0.68.0
      # `cargo kani setup` downloads its release bundle from GitHub (504s
      # lately) even when the cache above hit. Fetch the bundle ourselves, with
      # retries, keep the tarball in its own cache, and hand it to setup.
      - uses: actions/cache@v4
        with:
          path: ~/kani-bundle
          key: kani-bundle-0.68.0
      - name: Kani 0.68.0 (docs/pins.md)
        run: |
          bundle=kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p ~/kani-bundle
          [ -s ~/kani-bundle/$bundle ] || curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 \
            -o ~/kani-bundle/$bundle \
            https://github.com/model-checking/kani/releases/download/kani-0.68.0/$bundle
          # The pinned digest (docs/pins.md) is checked on every use, cached or
          # downloaded; a mismatch deletes the file and fails the job.
          echo "32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3  $HOME/kani-bundle/$bundle" \
            | sha256sum -c - || { rm -f ~/kani-bundle/$bundle; exit 1; }
          command -v cargo-kani || cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup --use-local-bundle ~/kani-bundle/$bundle
      - run: cargo kani -p planarian-txn
      - run: cargo kani -p planarian-exec
