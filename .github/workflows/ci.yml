# The Phase A gates that fit on a standard runner (SPEC §17: tests, the gym's
# Phase A catalog, the dependency-boundary check, Verus proofs, Kani
# harnesses). The VM tests are in vm.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Workspace clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy with the gym's fault-injection hooks
        if: success() || failure()
        run: cargo clippy -p planarian-daemon -p planarian-backend-linux --features planarian-daemon/gym-hooks -- -D warnings
      - name: Workspace tests (retain diagnostics after lint failures)
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast
      - name: Acceptance-tool negative regressions
        if: success() || failure()
        run: |
          python3 nix/gym/test_acceptance.py
          python3 nix/gym/test_proofs.py
          python3 nix/gym/test_manifest.py
          python3 nix/gym/test_performance.py
          python3 nix/gym/test_boot_fixture.py
      - name: Fault catalog, fake harness (complete applicable set and scoped waivers)
        if: success() || failure()
        run: bash nix/gym/run-fake.sh
      - name: GA demonstration, fake harness
        if: success() || failure()
        run: crates/gym/demo.sh --harness fake
      - name: Dependency boundaries
        if: success() || failure()
        run: bash nix/tests/boundaries.sh .

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Package, module evaluation, boundaries, Verus proofs
        run: >
          nix build -L
          .#checks.x86_64-linux.package
          .#checks.x86_64-linux.module-eval
          .#checks.x86_64-linux.boundaries
          .#checks.x86_64-linux.verus
      - name: Export successful source-bound Verus artifacts
        run: nix build .#checks.x86_64-linux.verus -o proof-result
      - uses: actions/upload-artifact@v4
        with:
          name: proof-verus
          path: |
            proof-result/verus.json
            proof-result/verus.log
          if-no-files-found: error

  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-0.68.0
      - name: Kani 0.68.0 (docs/pins.md)
        run: |
          command -v cargo-kani || cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Kani with source-bound success artifacts
        run: python3 nix/gym/proofs.py run --engine kani --output proof-results/kani.json
      - uses: actions/upload-artifact@v4
        with:
          name: proof-kani
          path: proof-results/kani.*
          if-no-files-found: error

  verification:
    needs: [rust, nix, kani]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-*
          merge-multiple: true
          path: proof-results
      - name: Complete invariant map, successful proofs, ratios and bypass gate
        run: cargo run -q -p planarian-gym -- verification --gate
