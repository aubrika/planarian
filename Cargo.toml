[workspace]
resolver = "3"
members = [
    "crates/schema",
    "crates/txn",
    "crates/policy",
    "crates/incident",
    "crates/diagnose",
    "crates/intent",
    "crates/changes",
    "crates/state",
    "crates/fake",
    "crates/exec",
    "crates/ipc",
    "crates/daemon",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"

[workspace.dependencies]
planarian-schema = { path = "crates/schema" }
planarian-txn = { path = "crates/txn" }
planarian-policy = { path = "crates/policy" }
planarian-incident = { path = "crates/incident" }
planarian-diagnose = { path = "crates/diagnose" }
planarian-intent = { path = "crates/intent" }
planarian-changes = { path = "crates/changes" }
planarian-state = { path = "crates/state" }
planarian-fake = { path = "crates/fake" }
planarian-exec = { path = "crates/exec" }
planarian-ipc = { path = "crates/ipc" }
planarian-daemon = { path = "crates/daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32c = "0.6"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
