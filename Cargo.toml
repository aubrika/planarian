[workspace]
resolver = "3"
members = ["crates/schema", "crates/txn"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"

[workspace.dependencies]
planarian-schema = { path = "crates/schema" }
planarian-txn = { path = "crates/txn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32c = "0.6"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
