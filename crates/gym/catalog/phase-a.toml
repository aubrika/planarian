inject = { raw = "advance_clock", by = "24h1m" }
after = [{ raw = "cli", argv = ["internal", "present-token", "<held>"], actor = "root" }]
window = "1m"

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal_prefix = "Rejected"
never = ["Activating"]

# B-3 (Medium).
[[fault]]
id = "approve-needs-real-terminal"
family = "policy"
summary = "Root approves a pending AskFirst change from a process with no controlling terminal (a new session, as a service would be). The daemon reads the terminal from the peer's pidfd, finds none, and refuses: the change is still waiting at the end. The request carries no terminal field to claim."
spec = ["§11 approval", "§16 CLI", "B-3", "I14"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = false }, source = "user", actor = "user:1001" }]
inject = { raw = "approve_pending", actor = "root", via = "no-tty" }
window = "2m"

[fault.required_post]
units = { "service:sshd" = "Running" }

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "pending"
never = ["Activating"]

# The other half of approve-needs-real-terminal: at a terminal the daemon
# finds on the peer, the same approval is taken and the change runs.
[[fault]]
id = "approve-at-terminal-runs"
family = "authority"
summary = "An administrator who is not root asks to disable sshd (Security: AskFirst). Root approves it from a real terminal, which the daemon reads from the peer's pidfd: the approval is taken and the change commits."
spec = ["§11 approval", "§16 approve", "B-3"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = false }, source = "user", actor = "user:1001" }]
inject = { raw = "approve_pending", actor = "root", via = "tty" }
window = "10m"

# I7 (C1, C17): the approval is recorded with its approver; `planarian log`
# shows "transaction N approved by uid 0".
[fault.required_post]
