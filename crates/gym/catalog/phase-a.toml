# decides: a peer gone before it is resolved has no session.
[[fault]]
id = "identity-peer-exited"
family = "authority"
summary = "alice, logged in at the seat, sends a stop of her own pipewire and exits before the daemon resolves her. With no process behind the connection, the daemon attributes the request to uid 1000 with no session: never to a session it cannot read from that process."
spec = ["§10 actors and sessions", "I21", "B-6"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["vm"]
intent = { kind = "none" }
setup = [{ raw = "greeter_login", uid = 1000 }]
inject = { raw = "request_then_exit", actor = "user:1000", request = { op = "stop", unit = "service@1000:pipewire" } }
window = "2m"

[[fault.required_post.txn]]
transition = "StopAndSuppress"
caller = "user:1000@-"

# B-11 (Medium).
[[fault]]
id = "residue-infer-stops-false"
family = "unattributed-residue"
summary = "A raw kill -9 of gym-backup, whose manifest sets inferStops = false, under Standard: never taken as intended; alarmed and started again, as a fault."
spec = ["§11 unattributed residue", "B-11"]
