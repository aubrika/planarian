# ═══════════════════════════════════════════════════════════════════════════
# v4.5: bypasses (docs/bypasses.md), signed off 2026-10-29
# ═══════════════════════════════════════════════════════════════════════════

# B-1 (High).
[[fault]]
id = "agent-run-own-principal"
family = "authority"
summary = "An administrator (uid 1001, planarian-admin) starts an agent with `planarian agent run coder`. The agent runs under a dynamic uid in its own unit, and acts with the permissions of the user who started it (§11, owner decision 2026-10-30): its stop of gym-web runs, as the administrator's would, and the executor log attributes it to agent:coder, acting for uid 1001."
spec = ["§11 principals", "§16 agent run", "B-1"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ raw = "agent_run", name = "coder", as = "user:1001", argv = ["/run/current-system/sw/bin/sleep", "infinity"] }]
inject = { raw = "cli", argv = ["stop", "service:gym-web"], actor = "agent:coder" }
window = "3m"

[fault.required_post]
units = { "service:gym-web" = "Overridden" }

[[fault.required_post.txn]]
transition = "StopAndSuppress"
target = "service:gym-web"
terminal = "Committed"
caller = "agent:coder"

# R03 (§11, rule 20): equivalent effects, equivalent facts.
[[fault]]
id = "override-stopped-equals-stop"
family = "authority"
summary = "An administrator with no session here (over SSH) asks, in turn, for an override that stops the display manager and for a plain stop of it. Both end the seated user's session: both derive SessionLoss over the same units and both are held at AskFirst, since it is not the caller's own session."
spec = ["§11 global floors", "§18 rule 20", "I21", "R03"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ raw = "greeter_login", uid = 1000 }]
inject = { raw = "cli", argv = ["override", "service:display-manager", "--stopped"], actor = "user:1001" }
after = [{ raw = "cli", argv = ["stop", "service:display-manager"], actor = "user:1001" }]
window = "3m"

[fault.required_post]
units = { "service:display-manager" = "Running" }

[[fault.required_post.txn]]
transition = "SetOverride"
tier = "AskFirst"
facts = { disruption = "SessionLoss" }
affected_includes = ["service:display-manager"]

[[fault.required_post.txn]]
transition = "StopAndSuppress"
tier = "AskFirst"
facts = { disruption = "SessionLoss" }
affected_includes = ["service:display-manager"]

# R09 (§12): admission before work.
[[fault]]
id = "unauthorized-change-does-no-work"
family = "authority"
summary = "alice, who may not change the configuration beyond her own settings, asks to disable sshd: refused Unauthorized before any source is staged, evaluated or built."
spec = ["§12 admission", "§11 authorization", "R09"]
tags = ["acceptance"]
scoring = "must-pass"
# Fake only: the fake counts its stages and builds; the VM has no such counter.
harness = ["fake"]
intent = { kind = "none" }
inject = { transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = false }, source = "user", actor = "user:1000" }
window = "2m"

[fault.required_post]
no_build_work = true
units = { "service:sshd" = "Running" }

[[fault.required_post.txn]]
transition = "ApplyChange"
refused_with = "Unauthorized"

# S07 (§12 step 4, §12h): approval tokens die with the daemon.
[[fault]]
id = "approval-dies-with-daemon"
family = "authority"
summary = "An administrator asks to disable sshd (AskFirst) and the approval is issued. The daemon restarts before anyone approves. The old approval is void: presenting it is refused, the change is asked for again, and nothing runs until the new request is approved."
spec = ["§12 step 4", "§12h", "S07"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  { transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = false }, source = "user", actor = "user:1001" },
  { raw = "approve_pending", actor = "root", via = "tty", hold_token = true },
  { raw = "restart_process", process = "planariad" },
]
inject = { raw = "cli", argv = ["internal", "present-token", "<held>"], actor = "root" }
window = "3m"

[fault.required_post]
units = { "service:sshd" = "Running" }
reports = ["TokenReplayRefused", "NeedsApproval"]

# The latest ApplyChange is the change asked for again after the restart,
# by its original caller (C21), still waiting for approval.
[[fault.required_post.txn]]
transition = "ApplyChange"
never = ["Activating"]
terminal = "pending"
caller = "user:1001"

[[fault]]
id = "release-refused-leaves-incident"
family = "authority"
summary = "gym-web keeps failing until its incident has spent its repair budget and escalated. alice, who may not act on gym-web, asks to release it: refused Unauthorized, and the incident record is unchanged (no budget restored, no attempt brought forward, not reopened)."
spec = ["§13", "§11 authorization", "R08"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  { raw = "set_persistent_knob", unit = "service:gym-web", knob = "fail_on_start", value = true },
  { raw = "kill_unit", unit = "service:gym-web", signal = "SIGSEGV" },
  { raw = "wait", for = "5m" },
]
inject = { raw = "cli", argv = ["release", "service:gym-web"], actor = "user:1000" }
window = "2m"

[fault.required_post]
incident_unchanged_by_refusal = "service:gym-web"

[[fault.required_post.txn]]
transition = "LiftOverride"
target = "service:gym-web"
refused_with = "Unauthorized"

[[fault]]
id = "agent-name-collision"
family = "authority"
summary = "alice (uid 1000) starts an agent named helper. An administrator then runs `planarian agent run helper` too: refused, naming alice as its owner. alice's agent stays alice's: its stop of gym-web, a system unit she may not stop, is refused. Authority is bound to the instance a start journaled, never the name (I24)."
spec = ["§11 principals", "§16 agent run", "I24", "B-20"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  { raw = "agent_run", name = "helper", as = "user:1000", argv = ["/run/current-system/sw/bin/sleep", "infinity"] },
  { raw = "agent_run", name = "helper", as = "user:1001", argv = ["/run/current-system/sw/bin/sleep", "infinity"] },
]
inject = { raw = "cli", argv = ["stop", "service:gym-web"], actor = "agent:helper" }
window = "3m"

[fault.required_post]
units = { "service:gym-web" = "Running" }
reports = ["AgentNameInUse"]

[[fault.required_post.txn]]
transition = "StopAndSuppress"
target = "service:gym-web"
refused_with = "Unauthorized"
caller = "agent:helper"

[[fault]]
id = "agent-has-its-users-permissions"
family = "authority"
summary = "alice (uid 1000, not an administrator) starts an agent with `planarian agent run helper`. It has alice's permissions and no more: its stop of gym-web, a system service alice may not stop, is refused Unauthorized; its stop of alice's own pipewire runs. Both are attributed to agent:helper."
spec = ["§11 principals", "§16 agent run", "B-1"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  { raw = "greeter_login", uid = 1000 },
  { raw = "agent_run", name = "helper", as = "user:1000", argv = ["/run/current-system/sw/bin/sleep", "infinity"] },
]
inject = { raw = "cli", argv = ["stop", "service:gym-web"], actor = "agent:helper" }
after = [{ raw = "cli", argv = ["stop", "service@1000:pipewire"], actor = "agent:helper" }]
window = "3m"

[fault.required_post]
units = { "service:gym-web" = "Running" }

[[fault.required_post.txn]]
transition = "StopAndSuppress"
target = "service:gym-web"
refused_with = "Unauthorized"
caller = "agent:helper"

[[fault.required_post.txn]]
transition = "StopAndSuppress"
target = "service@1000:pipewire"
terminal = "Committed"
caller = "agent:helper"

# The other half of approve-needs-real-terminal: at a terminal the daemon
# finds on the peer, the same approval is taken and the change runs.
[[fault]]
id = "approve-at-terminal-runs"
family = "authority"
summary = "An administrator who is not root asks to disable sshd (Security: AskFirst). Root approves it from a real terminal, which the daemon reads from the peer's pidfd: the approval is taken and the change commits."
spec = ["§11 approval", "§16 approve", "B-3"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = false }, source = "user", actor = "user:1001" }]
inject = { raw = "approve_pending", actor = "root", via = "tty" }
window = "10m"

# I7 (C1, C17): the approval is recorded with its approver; `planarian log`
# shows "transaction N approved by uid 0".
[fault.required_post]
approval_recorded_by = "root"

[[fault.required_post.txn]]
transition = "ApplyChange"
decision = "Allow(AskFirst)"
terminal = "Committed"

# B-6 (Medium). Pid reuse itself cannot be arranged reproducibly (P10 in
# assumptions.md, deviations.md); this checks the case the pidfd rule
# decides: a peer gone before it is resolved has no session.
[[fault]]
id = "identity-peer-exited"
family = "authority"
summary = "alice, logged in at the seat, sends a stop of her own pipewire and exits before the daemon resolves her. With no process behind the connection, the daemon attributes the request to uid 1000 with no session: never to a session it cannot read from that process."
spec = ["§10 actors and sessions", "I21", "B-6"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["vm"]
intent = { kind = "none" }
setup = [{ raw = "greeter_login", uid = 1000 }]
inject = { raw = "request_then_exit", actor = "user:1000", request = { op = "stop", unit = "service@1000:pipewire" } }
window = "2m"

[[fault.required_post.txn]]
transition = "StopAndSuppress"
caller = "user:1000@-"
