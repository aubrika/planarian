[[fault]]
id = "crash-daemon-restart-reconciles"
family = "daemon-killed"
summary = "GA demo tail: after the watchdog has reverted (crash-activating-bad), planariad restarts and writes a reconciliation record whose account of what happened matches the journal."
spec = ["§12 daemon restart reconciliation", "§4 GA(1)"]
tags = ["ga-demo"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "listen-address", args = { service = "gym-web", addr = "192.0.2.10" }, source = "user", actor = "user:1001" }]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { journal = "Activating" } }
after = [
  { raw = "hold_down", process = "planariad" },
  { raw = "wait", for = { journal = "Reverted" } },
  { raw = "release", process = "planariad" },
]
window = "20m"

[fault.required_post]
generation = "base"
journal_agrees = true
# Killed right after Activating was journaled and before the activation ran:
# the candidate never became active, and the record must say so.
reconciliation = { found = "Reverted", owner = "watchdog", daemon_action = "none", explains = ["killed-during-Activating", "watchdog-reverted", "why:candidate not active"] }

[[fault]]
id = "crash-slow-worker-overlap"
family = "daemon-killed"
summary = "The daemon is killed and immediately restarted while a deliberately slow activation worker survives. The new owner fences it, so activation and revert never overlap and the old owner can never commit."
spec = ["§12 ownership and fencing", "I6", "I15", "§15 v4-review"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  { raw = "slow_backend", call = "activate_live", delay = "120s" },
  { transition = "ApplyChange", change = "listen-address", args = { service = "gym-web", addr = "192.0.2.10" }, source = "user", actor = "user:1001" },
]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { journal = "Activating" } }
after = [{ raw = "restart_process", process = "planariad" }]
window = "20m"

[fault.required_post]
generation = "base"
journal_agrees = true
invariants = ["I6", "I15"]
no_overlap = ["activate_live(candidate)", "activate_live(revert_to)"]
stale_owner_commit = false

[[fault]]
id = "crash-withheld-job-reply"
family = "daemon-killed"
summary = "The backend accepts an activation job but its reply is withheld, and the owner is killed before the job id is journaled. Recovery must discover the job by its OpId, or fence it, before making any conflicting mutation."
spec = ["§12 OpId"]
tags = []
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "withhold_reply", call = "activate_live" },
  { transition = "ApplyChange", change = "font-scale", args = { scale = 1.25 }, source = "user", actor = "user:1000" },
]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { op_called = "activate_live" } }
after = [{ raw = "hold_down", process = "planariad" }]
window = "10m"

[fault.required_post]
journal_agrees = true
invariants = ["I6", "I15"]
quiescence_includes_tagged_jobs = true
no_overlap = ["activate_live(candidate)", "activate_live(revert_to)"]

[[fault]]
id = "crash-job-outlives-drain"
family = "daemon-killed"
summary = "An old backend job outlives the 60 s drain. The takeover ends in RecoveryFailed with the interlock set, and no overlapping mutation happens."
spec = ["§12 confirmed quiescence"]
tags = []
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  # Longer than the window: the job still holds on when the run is judged
  # (its activation, at the end of the delay, would come after).
  { raw = "slow_backend", call = "activate_live", delay = "1800s", uncancellable = true },
  { transition = "ApplyChange", change = "font-scale", args = { scale = 1.25 }, source = "user", actor = "user:1000" },
]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { op_called = "activate_live" } }
after = [{ raw = "hold_down", process = "planariad" }]
window = "10m"

[fault.required_post]
interlock = "set"
reports = ["RecoveryFailed", "alert"]
no_overlap = ["activate_live(candidate)", "activate_live(revert_to)"]

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "RecoveryFailed"

[[fault]]
id = "crash-jobs-tagged-unknown"
family = "daemon-killed"
summary = "jobs_tagged returns None for an unacknowledged OpId (the backend cannot say). Recovery writes RecoveryFailed instead of proceeding."
spec = ["§12 OpId"]
tags = []
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "backend_result", call = "jobs_tagged", result = "None" },
  { raw = "withhold_reply", call = "activate_live" },
  { transition = "ApplyChange", change = "font-scale", args = { scale = 1.25 }, source = "user", actor = "user:1000" },
]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { op_called = "activate_live" } }
window = "5m"

[fault.required_post]
interlock = "set"

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "RecoveryFailed"

