[[fault]]
id = "crash-runtime-rollback"
family = "daemon-killed"
summary = "Killed during Checking of a Runtime-tier Rollback; it recovers as a generation operation (serialized, owned, publish_boot, override restored) and completes. (Killed before the activation took effect, the crash table reverts instead, which is also correct.)"
spec = ["§12 execution table: Rollback", "§12 gym cases"]
tags = []
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [
  { transition = "ApplyChange", change = "font-scale", args = { scale = 1.25 }, source = "user", actor = "user:1000" },
  { raw = "wait", for = { journal = "Committed" } },
  { transition = "Rollback", source = "user", actor = "user:1001" },
]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { journal = "Checking" } }
after = [{ raw = "hold_down", process = "planariad" }]
window = "20m"

[fault.required_post]
generation = "known_good"
boot_default = "known_good"
override_source = "known_good"
journal_agrees = true

[[fault.required_post.txn]]
transition = "Rollback"
decision = "Allow(Runtime)"
recovery = "RevertGeneration"
terminal = "Committed"
owner = "watchdog"

[[fault]]
id = "crash-stop-and-suppress"
family = "daemon-killed"
summary = "Killed during a user's StopAndSuppress. It recovers as a unit operation: the override (journaled before the stop) holds, the unit is not restarted, and no generation rollback is attempted."
spec = ["§12 execution table", "§14 stopping"]
tags = []
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ raw = "ask", phrase = "stop gym-web until I say", actor = "user:1001" }]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { journal = "Activating" } }
after = [{ raw = "hold_down", process = "planariad" }]
window = "10m"

[fault.required_post]
units = { "service:gym-web" = "Overridden" }
overrides = [{ unit = "service:gym-web", until = "Explicit", by = "user:1001" }]
generation = "base"

[[fault.required_post.txn]]
transition = "StopAndSuppress"
recovery = "ReobserveOnly"
terminal = "Committed"

[[fault.required_post.txn]]
transition = "Revert"
count = 0

[[fault.required_post.txn]]
transition = "RestartUnit"
target = "service:gym-web"
count = 0
