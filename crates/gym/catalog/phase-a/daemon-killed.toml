# ═══════════════════════════════════════════════════════════════════════════
# Family: daemon-killed  (Activating, Checking, Reverting per §15; plus
# Published, Promoted per the v4-review acceptance list)
#
# Unless stated, the daemon is held down after the kill so the watchdog owns
# recovery. "good" candidate = font-scale 1.25; "bad" = listen-address 192.0.2.10.
# ═══════════════════════════════════════════════════════════════════════════

[[fault]]
id = "crash-activating-bad"
family = "daemon-killed"
summary = "planariad is killed during Activating of a bad candidate; the watchdog takes the lease, fences, confirms quiescence, and reverts."
spec = ["§12 crash-recovery table", "§4 GA(1)"]
tags = ["ga-demo", "acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "listen-address", args = { service = "gym-web", addr = "192.0.2.10" }, source = "user", actor = "user:1001" }]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { journal = "Activating" } }
after = [{ raw = "hold_down", process = "planariad" }]
window = "20m"

[fault.required_post]
units = { "service:gym-web" = "Running" }
generation = "base"
boot_default = "base"
override_source = "base"
journal_agrees = true
invariants = ["I6", "I12", "I15"]

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Reverted"
owner = "watchdog"
lease_epoch_min = 2

[[fault]]
id = "crash-activating-good"
family = "daemon-killed"
summary = "planariad is killed during Activating of a good candidate. The watchdog sees the candidate active, goes to Checking, the probes pass, and it runs the entire commit path."
spec = ["§12 watchdog"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "font-scale", args = { scale = 1.25 }, source = "user", actor = "user:1000" }]
inject = { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { op_called = "activate_live" } }
after = [{ raw = "hold_down", process = "planariad" }]
window = "20m"

[fault.required_post]
generation = "candidate"
boot_default = "candidate"
override_source = "candidate"
journal_agrees = true
invariants = ["I6", "I12", "I15"]

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"
owner = "watchdog"
path = ["Activating", "Checking", "Published", "Promoted", "Committed"]

