# ═══════════════════════════════════════════════════════════════════════════
# Family: security-floor (§12e, I16)
# ═══════════════════════════════════════════════════════════════════════════

[[fault]]
id = "floor-revert-blocked"
family = "security-floor"
summary = "A security update (gym-vulnlib 1.0 → 1.1, the old build carries knownVulnerabilities) commits and raises the floor. gym-web then crashes and fails every restart. The only rollback target, known_good, is below the floor: no Rollback runs, the incident escalates with RevertBlockedByFloor, and the boot default stays at the floor."
spec = ["§12e", "I16", "§11 Rollback row", "§15 v4.4"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { transition = "ApplyChange", change = "gym:security-fix", args = { version = "1.1" }, source = "user", actor = "user:1001" },
  { raw = "set_persistent_knob", unit = "service:gym-web", knob = "fail_on_start", value = true },
]
inject = { raw = "kill_unit", unit = "service:gym-web", signal = "SIGSEGV" }
window = "30m"

[fault.required_post]
security_floor = "candidate"
generation = "candidate"
boot_default = "candidate"
escalation = "RevertBlockedByFloor"
invariants = ["I1", "I16"]

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"

[[fault.required_post.txn]]
transition = "Rollback"
count = 0

[[fault.required_post.incident]]
target = "service:gym-web"
escalation = "RevertBlockedByFloor"

# I25: post-commit bookkeeping on every commit path.
[[fault]]
id = "floor-moves-via-watchdog"
family = "security-floor"
summary = "The daemon is killed once the security update is Promoted and stays down; the watchdog completes the commit. The floor moves to the fixing generation: the floor record is part of the commit, whoever writes Committed."
spec = ["§12e", "I25", "I16", "R02"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { transition = "ApplyChange", change = "gym:security-fix", args = { version = "1.1" }, source = "user", actor = "user:1001" },
  { raw = "kill_process", process = "planariad", signal = "SIGKILL", when = { journal = "Promoted" } },
  { raw = "hold_down" },
]
inject = { raw = "wait", for = "3m" }
window = "5m"

[fault.required_post]
security_floor = "candidate"

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"
owner = "watchdog"

[[fault]]
id = "floor-moves-via-boot-only"
family = "security-floor"
summary = "A security update that also needs a reboot takes the boot-only path: published to boot once, the machine restarts, the boot is confirmed and the change commits. The floor moves to it, as on the live path."
spec = ["§12e", "§12f", "I25", "R02"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "gym:security-fix", args = { version = "1.2" }, source = "user", actor = "user:1001" }]
inject = { raw = "reboot" }
window = "20m"

[fault.required_post]
security_floor = "candidate"

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"

[[fault]]
id = "revert-to-older-sets-no-floor"
family = "security-floor"
summary = "gym-newlib 1.0 is added, then a release makes it 2.0, which carries knownVulnerabilities. Undoing back to the 1.0 generation is a Revert to an older generation that merely lacks the newer package: it sets no security floor (§12e)."
spec = ["§12e", "I25"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { transition = "ApplyChange", change = "gym:newlib", args = { version = "1.0" }, source = "user", actor = "user:1001" },
  { raw = "wait", for = "2m" },
  { transition = "ApplyChange", change = "gym:newlib", args = { version = "2.0" }, source = "user", actor = "user:1001" },
  { raw = "approve_pending", actor = "root", via = "tty" },
  { raw = "wait", for = "2m" },
]
inject = { raw = "cli", argv = ["undo"], actor = "user:1001" }
after = [{ raw = "approve_pending", actor = "root", via = "tty" }]
window = "5m"

[fault.required_post]
security_floor = "none"

[[fault.required_post.txn]]
transition = "Revert"
terminal = "Committed"

[[fault]]
id = "floor-manual-rollback-needs-admin"
family = "security-floor"
summary = "After the security update, an administrator asks to roll back below the floor: AskFirst for an Administrator approver. The proposer cannot approve it (I19); root at a terminal can."
spec = ["§12e", "§11 floors", "I16", "I19"]
tags = ["extra"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [{ transition = "ApplyChange", change = "gym:security-fix", args = { version = "1.1" }, source = "user", actor = "user:1001" }]
inject = { transition = "Rollback", source = "user", actor = "user:1001" }
after = [
  { raw = "approve_pending", actor = "user:1001", via = "tty" },
  { raw = "approve_pending", actor = "root", via = "tty" },
]
window = "10m"

[fault.required_post]
security_floor = "candidate"
generation = "base"

[[fault.required_post.txn]]
transition = "Rollback"
decision = "Allow(AskFirst)"
approver_class = "Administrator"
terminal = "Committed"

# B-2 (High). VM only: the fake has no closure, so it cannot tell a service
# package from a system package. Not openssh: NixOS's openssh module adds its
# package to environment.systemPackages itself, so a fix there moved the floor
# before B-2 was fixed too and would not test it (deviations.md).
[[fault]]
id = "floor-service-package-fix"
family = "security-floor"
summary = "A change whose only security fix is in a service's package (gym-vulnsvc 1.0 -> 1.1; services.gym-vulnsvc.package, never in environment.systemPackages) commits. The security floor moves to it: the inspected set is the configuration's whole package set, not environment.systemPackages."
spec = ["§12e", "I16", "B-2"]
tags = ["acceptance", "bypass"]
scoring = "must-pass"
harness = ["vm"]
intent = { kind = "none" }
inject = { transition = "ApplyChange", change = "gym:service-package-fix", args = { version = "1.1" }, source = "user", actor = "root" }
window = "10m"

[fault.required_post]
security_floor = "candidate"

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"
