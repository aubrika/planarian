# ═══════════════════════════════════════════════════════════════════════════
# Family: bad-generation-activated
# ═══════════════════════════════════════════════════════════════════════════

[[fault]]
id = "gen-bad-switch"
family = "bad-generation-activated"
summary = "Switching to a prebuilt generation whose gym-web ExecStart is broken: AskFirst (the target was never live-tested), approved, fails its probes, reverted. The candidate never becomes the only boot entry."
spec = ["§11 table", "§12", "§12c /boot"]
tags = []
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
setup = [{ raw = "out_of_band_rebuild", edit = "build-only gym-web ExecStart=/bin/false", activate = false }]
inject = { transition = "SwitchGeneration", generation = "prebuilt", source = "user", actor = "user:1001" }
after = [{ raw = "approve_pending", actor = "root", via = "tty" }]
window = "15m"

[fault.required_post]
units = { "service:gym-web" = "Running" }
generation = "base"
boot_default = "base"
override_source = "base"
known_good = "unchanged"
journal_agrees = true
others_unchanged = true

[[fault.required_post.txn]]
transition = "SwitchGeneration"
decision = "Allow(AskFirst)"
terminal = "Reverted"

[[fault]]
id = "switch-facts-from-dry-activation"
family = "bad-generation-activated"
summary = "A prebuilt generation has the running one's manifest, but its NetworkManager unit has a new store path. Switching to it has the facts its dry activation shows: NetworkManager restarts, so it is ConnectivityLoss and asked first, as the same switch built as a candidate would be. Nobody approves, so nothing changes (§11 equivalent effects, R04)."
spec = ["§11", "R04"]
tags = ["acceptance"]
scoring = "must-pass"
# Fake only: the VM's prebuilt generations come from its own specialisations,
# none of which changes only a store path; the executor test covers Rollback.
harness = ["fake"]
intent = { kind = "none" }
setup = [{ raw = "out_of_band_rebuild", edit = "build-only NetworkManager store path", activate = false }]
inject = { transition = "SwitchGeneration", generation = "prebuilt", source = "user", actor = "user:1001" }
window = "5m"

[fault.required_post]
generation = "base"
others_unchanged = true

[[fault.required_post.txn]]
transition = "SwitchGeneration"
decision = "Allow(AskFirst)"
facts = { disruption = "ConnectivityLoss" }
affected_includes = ["service:NetworkManager"]

[[fault]]
id = "gen-override-only-change"
family = "bad-generation-activated"
summary = "A font-scale change touches only overrides.nix. The evaluated output differs from base, Stale is never raised (no owner edit happened), and the change commits."
spec = ["§9 steps 1 and 6", "§15 v4-review"]
tags = ["acceptance", "good-generation"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
inject = { transition = "ApplyChange", change = "font-scale", args = { scale = 1.25 }, source = "user", actor = "user:1000" }
window = "15m"

[fault.required_post]
generation = "candidate"
boot_default = "candidate"
override_source = "candidate"
live_tested = "candidate"
known_good = "unchanged"
evaluated_option = { "planarian.reference.fontScale" = 1.25 }
journal_agrees = true
others_unchanged = true

[[fault.required_post.txn]]
transition = "ApplyChange"
change = "font-scale"
decision = "Allow(Tested)"
terminal = "Committed"
path = ["Prepared", "Activating", "Checking", "Published", "Promoted", "Committed"]
never = ["Rejected(Stale)"]

[[fault]]
id = "gen-disable-reenable-canonical"
family = "bad-generation-activated"
summary = "An admin disables sshd (which has a canonical Readiness probe) and later re-enables it. Disabling makes the probe inapplicable without tampering with it, so neither change is reverted."
spec = ["§9 applicability", "I10", "§15 v4-review"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake", "vm"]
intent = { kind = "none" }
inject = { transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = false }, source = "user", actor = "user:1001" }
after = [
  { raw = "approve_pending", actor = "root", via = "tty" },
  { raw = "wait", for = { journal = "Committed" } },
  { transition = "ApplyChange", change = "service-enable", args = { service = "sshd", enabled = true }, source = "user", actor = "user:1001" },
  { raw = "approve_pending", actor = "root", via = "tty" },
]
window = "30m"

[fault.required_post]
units = { "service:sshd" = "Running" }
override_source = "candidate"
no_incident_on = ["service:sshd"]
journal_agrees = true

[[fault.required_post.txn]]
transition = "ApplyChange"
change = "service-enable"
args = { service = "sshd", enabled = false }
decision = "Allow(AskFirst)"
facts = { touches_canonical_probe = false, changes_desired = true }
terminal = "Committed"

[[fault.required_post.txn]]
transition = "ApplyChange"
change = "service-enable"
args = { service = "sshd", enabled = true }
terminal = "Committed"

[[fault]]
id = "owner-rebuild-breaks-service"
family = "bad-generation-activated"
summary = "The owner runs nixos-rebuild switch on a config that breaks gym-web. Planarian tries restarts and then escalates; it never rolls back an owner-built generation without AskFirst."
spec = ["Principle 9", "§13"]
tags = ["extra"]
scoring = "repair"
harness = ["fake", "vm"]
intent = { kind = "none" }
inject = { raw = "out_of_band_rebuild", edit = "gym-web ExecStart=/bin/false", activate = true }
window = "15m"

[fault.required_post]
units = { "service:gym-web" = "Failed" }
generation = "owner-built"
reports = ["DiagnoserExhausted"]
metrics = { restarts_max = { "service:gym-web" = 3 } }

[[fault.required_post.incident]]
target = "service:gym-web"
state = "Cooldown"

[[fault.required_post.txn]]
transition = "Rollback"
decision_not_below = "AskFirst"
terminal = "Committed"
count = 0
