# Family: activation-scheduling (catalog entries; format in 00-format.toml)

[[fault]]
id = "quiet-staged-update-foreground"
family = "activation-scheduling"
summary = "alice changes her font scale while a game holds Foreground in her session. The verified candidate waits in Built; once Foreground ends it activates in that window and commits."
spec = ["§12f", "I6", "§15 v4.4"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { raw = "foreground", session = "s1", on = true },
]
inject = { transition = "ApplyChange", change = "font-scale", args = { scale = "1.25" }, source = "user", actor = "user:1000@s1" }
after = [{ raw = "wait", for = "3m" }, { raw = "foreground", session = "s1", on = false }]
window = "5m"

[fault.required_post]
reports = ["WaitsForWindow"]

[[fault.required_post.txn]]
transition = "ApplyChange"
path = ["Built", "Activating", "Committed"]
terminal = "Committed"

# S03 (§12f, I12): parking in Built is bounded at 24 h.
[[fault]]
id = "built-parking-expires"
family = "activation-scheduling"
summary = "alice changes her font scale while a game holds Foreground in her session, and the game never lets go. After a day in Built the change is Cancelled by the daemon, with one notice naming it and how to issue it again; it never activates, even once the game ends."
spec = ["§12f", "I12", "S03"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { raw = "foreground", session = "s1", on = true },
]
inject = { transition = "ApplyChange", change = "font-scale", args = { scale = "1.25" }, source = "user", actor = "user:1000@s1" }
after = [{ raw = "wait", for = "25h" }, { raw = "foreground", session = "s1", on = false }, { raw = "wait", for = "5m" }]
window = "26h"

[fault.required_post]
reports = ["WaitsForWindow"]
notices_count = { match = "waited a day in Built", count = 1 }

[[fault.required_post.txn]]
transition = "ApplyChange"
path = ["Built", "Cancelled"]
terminal = "Cancelled"

# C21 (§12): re-prepared transactions keep their original caller and source.
[[fault]]
id = "reprepared-keeps-caller"
family = "activation-scheduling"
summary = "alice changes her font scale while a game holds Foreground in her session, so it waits in Built. The daemon restarts: the change is prepared again as alice's, in her session (not the daemon's), and commits once Foreground ends."
spec = ["§12", "§12f", "C21"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { raw = "foreground", session = "s1", on = true },
  { transition = "ApplyChange", change = "font-scale", args = { scale = "1.25" }, source = "user", actor = "user:1000@s1" },
  { raw = "wait", for = "1m" },
]
inject = { raw = "restart_process", process = "planariad" }
after = [{ raw = "wait", for = "2m" }, { raw = "foreground", session = "s1", on = false }]
window = "5m"

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"
caller = "user:1000@s1"
source = "user"

[[fault]]
id = "quiet-repair-not-deferred"
family = "activation-scheduling"
summary = "While a game holds Foreground, alice's PipeWire crashes. Repairs of what foreground work depends on are not deferred: it is repaired at once, with exactly one notice."
spec = ["§12f quiet mode"]
tags = ["acceptance"]
scoring = "repair"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { raw = "foreground", session = "s1", on = true },
  { raw = "wait", for = "1m" },
]
inject = { raw = "kill_unit", unit = "service@1000:pipewire", signal = "SIGSEGV" }
window = "2m"

[fault.required_post]
units = { "service@1000:pipewire" = "Running" }
notices_count = { match = "pipewire", count = 1 }

# §21 (v4.4): the invisibility budget; owner decision Q7 (Xonotic timedemo, MangoHud).
[[fault]]
id = "quiet-reference-workload"
family = "activation-scheduling"
summary = "The invisibility-budget benchmark (§21): the reference game runs while a GC, a staged update and a non-urgent fault are queued. p99 frame time and input latency match the Planarian-stopped baseline; each deferred item runs in its window afterward; a PipeWire crash mid-run is repaired with one notice."
spec = ["§12f", "§21 invisibility budget"]
tags = ["acceptance", "benchmark"]
scoring = "must-pass"
# Run by legacyPackages.bench.invisibility (nix/tests/bench.nix; .github/workflows/bench.yml),
# not by the gym runner: see deviations.md.
harness = ["bench"]
intent = { kind = "none" }
setup = [{ raw = "session_login", uid = 1000, session = "s1", seat = "seat0" }]
inject = { raw = "workload", name = "reference-game", queue = ["gc", "staged-update", "fault:gym-metrics"], mid_run = { raw = "kill_unit", unit = "service@1000:pipewire", signal = "SIGSEGV" } }
window = "20m"

[fault.required_post]
metrics = { frame_time_p99 = "no significant difference vs baseline", deferred_items_ran = 3 }
notices_count = { match = "pipewire", count = 1 }

# §12f *Rollbacks* (owner decision, Oct 31; #9). The committed update is
# alice's font scale; its flaw shows only once it is live
# (`break_in_generation`). In-place repair cannot fix a unit broken by its
# generation, so the diagnoser's last candidate is a Rollback to known_good
# (the base: a live commit is live_tested, not boot-confirmed).
[[fault]]
id = "rollback-repair-foreground-dependency"
family = "activation-scheduling"
summary = "alice's font-scale update commits; then, while a game holds Foreground in her session, the new generation's NetworkManager fails and restarts cannot fix it. Wi-Fi is something foreground work depends on, so the diagnoser's Rollback is a repair: it runs at once, during the workload, never parked in Built for a window, and Wi-Fi is back. One notice about it."
spec = ["§12f Rollbacks", "§12f quiet mode", "§13 ordering", "§15 v4.6"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { transition = "ApplyChange", change = "font-scale", args = { scale = "1.25" }, source = "user", actor = "user:1000@s1" },
  { raw = "wait", for = { journal = "Committed" } },
  { raw = "foreground", session = "s1", on = true },
  { raw = "wait", for = "1m" },
]
inject = { raw = "break_in_generation", unit = "service:NetworkManager", generation = "candidate" }
# Foreground holds for the whole window: whatever runs, runs during it.
after = [{ raw = "wait", for = "15m" }]
window = "16m"

[fault.required_post]
units = { "service:NetworkManager" = "Running" }
generation = "known_good"
notices_count = { match = "NetworkManager", count = 1 }

[[fault.required_post.txn]]
transition = "ApplyChange"
terminal = "Committed"

# "is not parked in Built": no waiting for a window between Built and Activating.
[[fault.required_post.txn]]
transition = "Rollback"
source = "diagnoser"
terminal = "Committed"

[[fault.required_post.incident]]
target = "service:NetworkManager"

[[fault]]
id = "rollback-repair-foreground-unrelated"
family = "activation-scheduling"
summary = "The same committed update, but the new generation breaks the print service, which foreground work does not depend on. While the game holds Foreground the repair is deferred in fact: no Rollback (and no other repair) is submitted, no transaction is opened, and the incident's budget does not move. When the game ends the deferred repair runs: in-place repair fails, the Rollback runs and the printer is back."
spec = ["§12f Rollbacks", "§12f quiet mode", "§13", "§15 v4.6"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { transition = "ApplyChange", change = "font-scale", args = { scale = "1.25" }, source = "user", actor = "user:1000@s1" },
  { raw = "wait", for = { journal = "Committed" } },
  { raw = "foreground", session = "s1", on = true },
  { raw = "wait", for = "1m" },
]
inject = { raw = "break_in_generation", unit = "service:gym-printer", generation = "candidate" }
after = [
  { raw = "wait", for = "20m" },
  { raw = "foreground", session = "s1", on = false },
  { raw = "wait", for = "15m" },
]
window = "36m"

[fault.required_post]
units = { "service:gym-printer" = "Running" }
generation = "known_good"

[[fault.required_post.txn]]
transition = "Rollback"
source = "diagnoser"
terminal = "Committed"

# The diagnoser does not submit it while Foreground holds: no transaction
# opened, finished or parked.
[[fault.required_post.txn]]
transition = "Rollback"
count = 0
while_foreground = "s1"

# Nor any other repair of this incident ("deferred in fact", §12f quiet mode).
[[fault.required_post.txn]]
source = "diagnoser"
count = 0
while_foreground = "s1"

[[fault.required_post.incident]]
target = "service:gym-printer"
budget_steady_while_foreground = "s1"

[[fault]]
id = "rollback-repair-session-loss-asks"
family = "activation-scheduling"
summary = "alice's font-scale update commits; then the new generation breaks the print service and restarts cannot fix it. Switching back would also restart the display manager, which hosts her active session's compositor, so the diagnoser's Rollback would end her session: being a repair exempts it from waiting, never from asking. It is AskFirst (SessionLoss; the diagnoser is not the session's own user) and, with nobody approving, it never runs: the update stays live."
spec = ["§12f Rollbacks", "§11 global floors", "§15 v4.6"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "session_login", uid = 1000, session = "s1", seat = "seat0" },
  { transition = "ApplyChange", change = "font-scale", args = { scale = "1.25" }, source = "user", actor = "user:1000@s1" },
  { raw = "wait", for = { journal = "Committed" } },
]
# The printer's in-place restart is Brief (Runtime), so the chain reaches the
# Rollback; only the Rollback carries SessionLoss.
inject = { raw = "break_in_generation", unit = "service:gym-printer", generation = "candidate", switch_restarts = ["service:display-manager"] }
after = [{ raw = "wait", for = "15m" }]
window = "16m"

[fault.required_post]
generation = "candidate"
units = { "service:display-manager" = "Running" }

[[fault.required_post.txn]]
transition = "Rollback"
source = "diagnoser"
decision = "Allow(AskFirst)"
facts = { disruption = "SessionLoss" }
terminal = "pending"
