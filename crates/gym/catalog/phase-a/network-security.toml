# Family: network-security (§12d "Network security fails closed", "Which
# units"; owner decisions, Nov 2). The reviewer's cases for the classifier,
# written from the spec before the change, on the fake harness's scripted
# footprint feed (`footprint`, `footprint_stale`, `netwatch`; 00-format.toml).
#
# §12d: "A *network tool* is a unit able to change how traffic leaves the
# machine … computed at build time from the unit's systemd configuration,
# never from its name; fail closed. A network tool is *protecting traffic*
# while the kernel has attributed to it a change that currently steers
# traffic … A *network-security unit* is a network tool that is protecting
# traffic. … Fail closed: a change the kernel could not attribute, a
# footprint missing or stale when a network tool fails, or a watch that
# failed to attach, all count as protecting." And: when one has failed, "its
# traffic is held"; its restart "runs at once"; the hold "is lifted when the
# unit is `Running` and its Readiness probes pass".

[[fault]]
id = "netsec-unnamed-tool-protecting-holds"
family = "network-security"
summary = "gym-netd, a network tool whose name matches nothing, created an interface that carries the default route. It crashes: its traffic is held, it is restarted at once without asking, and the hold lifts once it is back."
spec = ["§12d Which units", "§12d Network security fails closed", "§11 RestartUnit row"]
tags = ["acceptance"]
scoring = "must-pass"
harness = ["fake"]
intent = { kind = "none" }
setup = [
  { raw = "footprint", unit = "service:gym-netd", change = "interface", interface = "gnet0", steers = false },
  { raw = "footprint", unit = "service:gym-netd", change = "route", interface = "gnet0", steers = true },
  { raw = "wait", for = "30s" },
]
inject = { raw = "kill_unit", unit = "service:gym-netd", signal = "SIGSEGV" }
window = "3m"

[fault.required_post]
units = { "service:gym-netd" = "Running" }
holds_seen = ["service:gym-netd"]
holds_at_end = []

[[fault.required_post.txn]]
transition = "RestartUnit"
target = "service:gym-netd"
decision = "Allow(Runtime)"
terminal = "Committed"

