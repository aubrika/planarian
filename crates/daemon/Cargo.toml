[package]
name = "planarian-daemon"
description = "planariad: the Planarian daemon (SPEC §10–§16)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "planarian_daemon"
path = "src/lib.rs"

[[bin]]
name = "planariad"
path = "src/main.rs"

[dependencies]
planarian-schema.workspace = true
planarian-txn.workspace = true
planarian-policy.workspace = true
planarian-changes.workspace = true
planarian-state.workspace = true
planarian-incident.workspace = true
planarian-diagnose.workspace = true
planarian-intent.workspace = true
planarian-exec.workspace = true
planarian-ipc.workspace = true
planarian-backend-linux.workspace = true
rustix = { version = "1", features = ["net"] }
serde.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
serde_json.workspace = true

[features]
# Fault injection for the gym's VM harness. Never in the shipped package.
gym-hooks = ["planarian-backend-linux/gym-hooks"]

[dev-dependencies]
planarian-fake.workspace = true
planarian-schema = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
