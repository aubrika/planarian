# The verification ratio d:a and the trust count (SPEC §17a), per invariant.
#
# `discharged`: proof obligations a tool closes on every CI run, as
#   "crate::name": a Verus `proof fn` (or a function verified against its
#   `ensures`) or a Kani harness. Tests do not discharge anything; they are
#   listed under `tested` and not counted.
# `assumes`: the docs/assumptions.md ids (V, P, G, U) the invariant rests on.
#
# `[verifier]`: what each crate's Verus run reports ("N verified, 0
#   errors"). The Verus flake check (nix/tests/verus.nix) fails when its log
#   disagrees, and the accounting cannot credit a crate with more distinct
#   Verus obligations than that (R14). A discharged name must be a `proof
#   fn`, a function with `ensures` inside `verus!`, or a `#[kani::proof]`
#   harness; a function that is only present discharges nothing.
#
# `planarian-gym verification` checks that every name exists in the source
# and every id in assumptions.md, prints the report, and fails if a ratio
# fell or the trust count grew against [baseline] (the ratchet: every gate).


# Re-accounted for SPEC v4.5 (2026-10-29), once, as §17a allows; not a
# regression. Trust count 32 -> 37: proof-validity entries added (V7 the
# specifications, V8 Verus, V9 Z3, V10 rustc, V11 Kani/CBMC), P10 added
# (pidfd semantics, B-6), and P9 moved out to U1. Internal-unproven count
# 0 -> 5 (U1-U5: derive, authorization, the residue classifier, journal
# I/O, identity resolution), reported apart from the trust count. d:a
# 47:50 -> 47:56 because I17-I19, I21 and I22 now cite the U code they rest
# on. Earlier: 28:43 at GA; 32:43 (four obligations mapped to I6 and I12);
# 42:50 (I21-I23); 47:50 (I18's hash chain). Change these only when a change
# improves them.
#
# Re-baselined 2026-10-31 by owner decision: I9, I24 and I25, invariants of
# §7 that had no row, are accounted (the guarantees site, §17c, showed them
# as "not accounted"). d:a 47:56 -> 47:62: their six assumptions are new to
# the count, not a regression in what is proved; the trust count is
# unchanged (37), since every id they cite was already counted.
[baseline]
trust_count = 37
internal_unproven = 5
discharged = 47
assumed = 62

[baseline.per_invariant]
I1 = [0, 2]
I10 = [1, 2]
I11 = [2, 2]
I12 = [9, 8]
I13 = [0, 1]
I14 = [1, 2]
I15 = [2, 2]
I16 = [2, 3]
I17 = [0, 2]
I18 = [5, 3]
I19 = [3, 3]
I2 = [0, 2]
I20 = [0, 2]
I21 = [2, 4]
I22 = [5, 4]
I23 = [3, 1]
I3 = [0, 2]
I4 = [0, 1]
I5 = [4, 3]
I6 = [7, 5]
I7 = [0, 1]
I8 = [1, 1]
I9 = [0, 1]
I24 = [0, 3]
I25 = [0, 2]

[verifier]
schema = 17
policy = 52
txn = 52

[[invariant]]
id = "I1"
statement = "A boot-confirmed known-good generation always exists and is in the boot menu."
phase = "D (proof)"
tested = ["exec::tests (vm-generations)"]
discharged = []
assumes = ["P3", "P8"]

[[invariant]]
id = "I2"
statement = "The installed core package's hash equals the hash recorded in its signature."
phase = "E"
tested = ["gym posture-integrity-core-hash"]
discharged = []
assumes = ["P5", "P8"]

[[invariant]]
id = "I3"
statement = "Garbage collection never removes known-good, the previous, the current generation, an in-flight candidate or the boot model."
phase = "A (test), D (proof)"
tested = ["schema::gc tests", "gym storage-budget-unsatisfiable"]
discharged = []
assumes = ["P1", "P8"]

[[invariant]]
id = "I4"
statement = "Running means desired-Running, observed-active, and every applicable Readiness probe passed with fresh evidence."
phase = "A"
tested = ["state tests"]
discharged = []
assumes = ["P6"]

[[invariant]]
id = "I5"
statement = "Forbidden actions are unrepresentable; Reject is never converted to a tier by any setting."
phase = "A (proof)"
discharged = ["policy::decide", "policy::i5_autonomy_never_touches_reject", "policy::unauthorized_is_refused_first", "policy::core_is_never_a_target"]
assumes = ["V1", "V2", "V3"]

[[invariant]]
id = "I6"
statement = "At most one generation-changing transaction is active; nothing executes during Activating, Published, Promoted or Reverting."
phase = "A (proof)"
discharged = ["txn::validate", "txn::apply", "txn::well_formed", "txn::i6_one_generation_active", "txn::compatible_exec", "txn::only_generations_publish", "txn::boot_only_never_activates"]
assumes = ["V3", "V4", "V5", "V6", "P4"]

[[invariant]]
id = "I7"
statement = "Every executed transition is logged with its proposal, facts, decision and outcome."
phase = "A"
tested = ["daemon core tests", "gym (every entry reads the executor log)"]
discharged = []
assumes = ["P4"]

[[invariant]]
id = "I8"
statement = "A tier-3 transition executes only with an approval token bound to the concrete candidate, re-validated before execution."
phase = "A, C (proof)"
tested = ["exec tests", "gym approval-token-*"]
discharged = ["exec::approval_tokens_expire_after_their_lifetime"]
assumes = ["P5"]

[[invariant]]
id = "I10"
statement = "No change that alters a canonical probe executes below AskFirst; canonical probes come from the installed core package."
phase = "A"
tested = ["state tests", "gym en-i10-a-canonical-probe-cannot-be-removed"]
discharged = ["policy::i10_canonical_probe_changes_ask"]
assumes = ["V1", "U1"]

[[invariant]]
id = "I11"
statement = "A session's cumulative effect is classified at least as high as any single transition producing it."
phase = "A (proof)"
discharged = ["policy::i11_non_routine_session_asks", "policy::i11_session_only_raises"]
assumes = ["V1", "V2"]

[[invariant]]
id = "I12"
statement = "Under the progress assumptions, every transaction reaches a terminal state; RecoveryFailed alerts and sets the interlock."
phase = "A (proof, conditional)"
tested = ["exec crash-point property tests", "gym fake-assumptions-conformance"]
discharged = ["txn::i12_steps_terminate", "txn::i12_terminal_always_reachable", "txn::terminal_is_final", "txn::refusal_only_before_mutation", "txn::apply", "txn::recovery_table_follows_the_state_machine", "txn::watchdog_takes_over_only_when_it_should", "txn::step_allowed", "txn::add_interlock"]
assumes = ["G1", "G2", "G3", "G4", "P1", "P4", "P7", "V5"]

[[invariant]]
id = "I13"
statement = "A unit under an override is never a repair target while the override holds."
phase = "A"
tested = ["incident tests", "gym intent-user-stops-service"]
discharged = []
assumes = ["P6"]

[[invariant]]
id = "I14"
statement = "Policy facts are derived by the executor from the evaluated generation, never read from a proposal."
phase = "A (proof)"
discharged = ["policy::i14_facts_caller_is_not_authority"]
assumes = ["U1", "V3"]

[[invariant]]
id = "I15"
statement = "Exactly one owner per transaction; a stale epoch is refused; only the lease holder advances the journal."
phase = "A (proof)"
tested = ["gym fake-assumptions-conformance (Fenced)"]
discharged = ["txn::validate", "txn::takeover_fences_out_the_previous_owner"]
assumes = ["P4", "P7"]

[[invariant]]
id = "I16"
statement = "No automatic revert, rollback or boot fallback goes below the security floor; going below needs an administrator."
phase = "A (proof of decide and target selection; bootloader by test)"
tested = ["gym floor-revert-blocked", "gym floor-manual-rollback-needs-admin"]
discharged = ["policy::i16_below_floor_needs_administrator", "policy::administrator_class_only_on_ask_first"]
assumes = ["V1", "V2", "P3"]

[[invariant]]
id = "I17"
statement = "The set of principals holding administrator capability is never empty."
phase = "A"
tested = ["policy::i17_root_is_always_an_administrator"]
discharged = []
assumes = ["P8", "U2"]

[[invariant]]
id = "I18"
statement = "Every journal record commits to its predecessor's hash; a broken chain is detected on read."
phase = "A (proof, trusting SHA-256)"
tested = ["txn journal tests", "gym journal-record-edited", "gym posture-integrity-journal-chain"]
discharged = ["txn::follows", "txn::verify", "txn::next_link", "txn::appending_keeps_the_chain", "txn::an_edited_record_breaks_the_chain"]
assumes = ["P5", "P4", "U4"]

[[invariant]]
id = "I19"
statement = "No principal approves its own proposal or grants itself a capability it does not hold."
phase = "A (proof), C"
discharged = ["policy::i19_no_self_approval", "policy::may_approve", "policy::may_grant"]
assumes = ["V1", "U2", "U5"]

[[invariant]]
id = "I20"
statement = "No agent principal starts while planarian-ready.target is not reached, in every failure posture."
phase = "A"
tested = ["vm-posture", "gym posture-*"]
discharged = []
assumes = ["P6", "P8"]

[[invariant]]
id = "I21"
statement = "No irreversible transition, or one that may lose a session, user data or connectivity, runs below AskFirst unless the loss falls only on the caller's own session (with a seat, for connectivity); a loss reaching another user's session needs an administrator."
phase = "A (proof)"
discharged = ["policy::global_floors", "policy::own_session_is_per_session"]
assumes = ["V1", "V2", "U1", "U5"]

[[invariant]]
id = "I22"
statement = "Generation changes, garbage collection, driver binding, resolving the interlock and overriding a Security-sensitive unit are administrator operations; a Security-sensitive unit is changed without approval only to restore its declared state; agents and the unattributed actor hold no authority (Phase A)."
phase = "A (proof)"
tested = ["gym residue-kill9-security", "gym residue-stop-security-unit"]
discharged = ["policy::users_cannot_change_generations", "policy::only_administrators_resolve", "policy::security_override_held_for_administrator", "policy::security_restart_runs_alone_only_to_restore", "policy::agents_and_unattributed_are_refused"]
assumes = ["V1", "P8", "U1", "U2"]

[[invariant]]
id = "I23"
statement = "A generation transaction commits only after its boot entry is written and promoted; a runtime transaction never publishes, promotes or reverts; the override file is replaced only by compare-and-swap."
phase = "A (proof)"
tested = ["gym stale-owner-edit-during-build"]
discharged = ["txn::generations_commit_after_promotion", "txn::runtime_never_reverts", "txn::override_swap_never_overwrites_a_third_party"]
assumes = ["P3"]

[[invariant]]
id = "I9"
statement = "The model process holds exactly one write capability: submit a proposal."
phase = "B (by the sandbox, §20, and a gym case), E (proof)"
tested = []
discharged = []
assumes = ["P8"]

[[invariant]]
id = "I24"
statement = "An agent's authority is bound to the one AgentStarted record for the unit instance it runs in, identified by that instance (not by name)."
phase = "A"
tested = ["daemon core tests", "gym agent-name-collision"]
discharged = []
assumes = ["P4", "P6", "U5"]

[[invariant]]
id = "I25"
statement = "Post-commit bookkeeping runs on every path that writes Committed for a generation transaction; a commit whose floor record cannot be appended does not commit."
phase = "A"
tested = ["gym floor-moves-via-watchdog", "gym floor-moves-via-boot-only", "gym revert-to-older-sets-no-floor"]
discharged = []
assumes = ["P1", "P4"]
